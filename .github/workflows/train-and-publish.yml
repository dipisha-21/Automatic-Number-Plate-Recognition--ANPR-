name: Train and Publish ANPR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ultralytics>=8.3,<9" "torch>=2.2" "torchvision>=0.17"

      - name: Train detector
        run: |
          yolo detect train \
            model=yolov8n.pt \
            data=data.yaml \
            epochs=50 \
            imgsz=640 \
            batch=8 \
            device=cpu \
            workers=2 \
            seed=42 \
            deterministic=True \
            project="$GITHUB_WORKSPACE/runs/detect" \
            name=anpr_retrain \
            exist_ok=True

      - name: Validate detector
        run: |
          yolo detect val \
            model="$GITHUB_WORKSPACE/runs/detect/anpr_retrain/weights/best.pt" \
            data=data.yaml \
            imgsz=640 \
            device=cpu \
            project="$GITHUB_WORKSPACE/runs/val" \
            name=anpr_retrain \
            exist_ok=True

      - name: Stage deployable model
        run: |
          mkdir -p deploy-model
          cp "$GITHUB_WORKSPACE/runs/detect/anpr_retrain/weights/best.pt" deploy-model/best.pt
          cp "$GITHUB_WORKSPACE/runs/detect/anpr_retrain/results.csv" deploy-model/training-results.csv || true
          test -s deploy-model/best.pt
          ls -lh deploy-model

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: anpr-trained-model
          path: deploy-model/
          if-no-files-found: error
          retention-days: 30

      - name: Publish model as persistent GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="anpr-model-demo"
          NOTES="Prototype YOLOv8 ANPR detector trained by GitHub Actions. The current repository retraining dataset is very small, so this release is intended for portfolio/demo use rather than production accuracy claims."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" deploy-model/best.pt --clobber
            gh release upload "$TAG" deploy-model/training-results.csv --clobber || true
          else
            gh release create "$TAG" deploy-model/best.pt deploy-model/training-results.csv \
              --title "ANPR Demo Model" \
              --notes "$NOTES" \
              --target "${GITHUB_SHA}"
          fi
