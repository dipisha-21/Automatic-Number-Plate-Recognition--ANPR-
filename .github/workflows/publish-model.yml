name: Publish ANPR Model

on:
  workflow_run:
    workflows: ["Train ANPR Model"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: anpr-trained-model
          path: deploy-model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs track "models/*.pt"

      - name: Publish best model
        run: |
          mkdir -p models
          cp deploy-model/best.pt models/best.pt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes models/best.pt
          git commit -m "model: publish trained ANPR detector" || exit 0
          git push
