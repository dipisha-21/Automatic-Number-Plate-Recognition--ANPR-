name: Train ANPR Model

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ultralytics>=8.3,<9" "torch>=2.2" "torchvision>=0.17"

      - name: Train YOLOv8 plate detector
        run: |
          yolo detect train \
            model=yolov8n.pt \
            data=data.yaml \
            epochs=50 \
            imgsz=640 \
            batch=8 \
            device=cpu \
            workers=2 \
            seed=42 \
            deterministic=True \
            project=${{ github.workspace }}/runs/detect \
            name=anpr_retrain \
            exist_ok=True

      - name: Validate trained detector
        run: |
          yolo detect val \
            model=${{ github.workspace }}/runs/detect/anpr_retrain/weights/best.pt \
            data=data.yaml \
            imgsz=640 \
            device=cpu \
            project=${{ github.workspace }}/runs/val \
            name=anpr_retrain \
            exist_ok=True

      - name: Stage deployable model
        run: |
          mkdir -p deploy-model
          cp "${{ github.workspace }}/runs/detect/anpr_retrain/weights/best.pt" deploy-model/best.pt
          cp "${{ github.workspace }}/runs/detect/anpr_retrain/results.csv" deploy-model/training-results.csv || true

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: anpr-trained-model
          path: deploy-model/
          retention-days: 30
